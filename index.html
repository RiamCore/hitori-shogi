<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひとり将棋">
<meta name="theme-color" content="#f4ead5">
<link rel="manifest" href="manifest.json">
<title>ひとり将棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section id="menuScreen" class="screen menu-screen" aria-label="メニュー">
    <div class="menu-content">
      <div class="title-piece" aria-hidden="true">将</div>
      <h1>ひとり将棋</h1>
      <p class="menu-description">CPUと将棋を楽しみましょう</p>
      <label for="difficulty">CPUの強さ</label>
      <select id="difficulty">
        <option value="1">1・やさしい</option>
        <option value="2" selected>2・ふつう</option>
        <option value="3">3・つよい</option>
      </select>
      <button id="startGame" class="primary">対局開始</button>

      <details class="sound-settings" id="soundSettings">
        <summary>音量設定</summary>
        <div class="sound-setting-row">
          <label for="effectVolume">駒音・チャイム</label>
          <output id="effectVolumeValue" for="effectVolume">150%</output>
          <input id="effectVolume" type="range" min="0" max="200" step="10" value="150">
        </div>
        <div class="sound-setting-row">
          <label for="voiceVolume">音声案内（成り・王手）</label>
          <output id="voiceVolumeValue" for="voiceVolume">100%</output>
          <input id="voiceVolume" type="range" min="0" max="100" step="10" value="100">
          <p class="volume-note">音声案内はiPhoneの音量設定も使います。</p>
        </div>
        <div class="sound-test-buttons">
          <button type="button" id="testPieceSound" class="secondary">駒音を試す</button>
          <button type="button" id="testVoiceSound" class="secondary">音声を試す</button>
        </div>
      </details>
      <p class="menu-note">駒をタップしてから、移動先をタップします。<br>エンジンが使えない場合は簡易CPUに切り替わります。</p>
    </div>
  </section>

  <section id="gameScreen" class="screen game-screen" hidden aria-label="対局画面">
    <header class="game-header">
      <p id="status" role="status">あなたの番です</p>
      <div class="game-actions">
        <button id="undo" class="secondary">待った</button>
        <button id="backToMenu" class="secondary">メニュー</button>
      </div>
    </header>

    <section class="captured cpu-captured">
      <div class="hand-title">CPUの持ち駒</div>
      <div id="cpuHand" class="hand" aria-label="CPUの持ち駒"></div>
    </section>

    <section class="board-wrap" aria-label="将棋盤">
      <div id="board" class="board"></div>
    </section>

    <section class="captured player-captured">
      <div class="hand-title">あなたの持ち駒（タップして打つ）</div>
      <div id="playerHand" class="hand" aria-label="あなたの持ち駒"></div>
    </section>
    <p class="play-hint">駒を選び、移動先をタップしてください。</p>

    <div id="resultModal" class="result-modal" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="result-card">
        <h2 id="resultTitle">対局終了</h2>
        <p id="resultMessage" class="result-message">あなたの勝ちです</p>
        <button id="resultToMenu" class="primary result-menu-button">メニューに戻る</button>
      </div>
    </div>
  </section>
</main>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
